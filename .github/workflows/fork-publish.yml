name: Sync and Publish Fork

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [master]
    paths:
      - 'plugins/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/libs/**'
      - 'src/types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.production.json'
      - '.github/workflows/fork-publish.yml'
      - '.github/fork/**'

permissions:
  contents: write

concurrency:
  group: fork-sync-and-publish
  cancel-in-progress: false

jobs:
  sync-and-publish:
    if: github.repository == 'alirafiqmalik/lnreader-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Test publishing safeguards
        run: python3 .github/fork/test_publish.py

      - name: Merge upstream without discarding fork changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/lnreader/lnreader-plugins.git refs/heads/master:refs/remotes/upstream/master
          upstream_sha=$(git rev-parse refs/remotes/upstream/master)
          if ! git merge --no-ff -m 'chore(sync): merge upstream master [skip ci]' "$upstream_sha"; then
            git merge --abort
            echo '::error::Upstream conflicts with fork changes. Resolve the merge on master, then rerun this workflow.'
            echo 'Upstream sync stopped because of a merge conflict. Fork source and published plugins were preserved.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Retire branches merged upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=.github/fork/active-branches
          owner=${GITHUB_REPOSITORY%%/*}
          for branch in $(sed 's/#.*//; s/[[:space:]]//g; /^$/d' "$list"); do
            # Pin every input before checking PRs or publishing any source changes.
            if ! git fetch -q origin "+refs/heads/$branch:refs/fork-inputs/$branch"; then
              echo "::error::$branch is active but unavailable. The last published plugins were preserved."
              exit 1
            fi
            head=$(git rev-parse "refs/fork-inputs/$branch")
            prs=$(gh api "repos/lnreader/lnreader-plugins/pulls?head=$owner:$branch&state=all&per_page=100" \
              --paginate --jq '.[] | [.number, .state, (.merged_at // "-"), .head.sha, (.merge_commit_sha // "-")] | @tsv')
            while IFS=$'\t' read -r number state merged_at pr_head merge_sha; do
              [ "$pr_head" = "$head" ] || continue
              if [ "$merged_at" != - ] && [ "$merge_sha" != - ] &&
                git merge-base --is-ancestor "$merge_sha" refs/remotes/upstream/master; then
                sed -i "\#^$branch\$#d" "$list"
                git commit -q -m "chore(fork): retire $branch [skip ci]" -- "$list"
                echo "Retired \`$branch\`: upstream merged #$number at the published head." >> "$GITHUB_STEP_SUMMARY"
                break
              elif [ "$state" = closed ] && [ "$merged_at" = - ]; then
                echo "::warning::$branch: upstream closed #$number without a merge. It stays published until you retire it or reopen the PR."
              fi
            done <<< "$prs"
          done
          # Skip-ci messages stop an extra run; this job publishes the source.
          git push origin HEAD:refs/heads/master
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge active branches for this build only
        shell: bash
        run: |
          git switch -q -c fork-publish-build
          echo '### Published branches' >> "$GITHUB_STEP_SUMMARY"
          echo "- \`master\` @ $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          for branch in $(sed 's/#.*//; s/[[:space:]]//g; /^$/d' .github/fork/active-branches); do
            head=$(git rev-parse --verify "refs/fork-inputs/$branch")
            if ! git merge -q --no-ff -m "build: include $branch" "$head"; then
              git merge --abort
              echo "::error::$branch conflicts with master. Rebase it on upstream/master, then rerun this workflow."
              echo "Publish stopped: \`$branch\` conflicts. The last published plugins were preserved." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- \`$branch\` @ $(git rev-parse --short "$head")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Build plugins with fork URLs
        shell: bash
        run: |
          publish_branch="plugins/v$(node -p "require('./package.json').version")"
          echo "PUBLISH_BRANCH=$publish_branch" >> "$GITHUB_ENV"
          # A failed remote read stops the build; an empty result means a new ref.
          previous=$(git ls-remote --heads origin "refs/heads/$publish_branch")
          previous_sha=${previous%%$'\t'*}
          echo "PUBLISH_PREVIOUS_SHA=$previous_sha" >> "$GITHUB_ENV"
          if [ -z "$previous_sha" ]; then
            echo "::warning::New publish branch $publish_branch. Change the repository URL in the app to https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$publish_branch/.dist/plugins.min.json"
          fi
          BRANCH="$publish_branch" npm run build:full
          mkdir -p .js/src
          cp -r .js/plugins .js/src/plugins

      - name: Validate manifest and downloadable files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plugins = JSON.parse(fs.readFileSync('.dist/plugins.min.json', 'utf8'));
          if (!Array.isArray(plugins) || plugins.length === 0) throw new Error('Empty plugin manifest');
          const prefix = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/${process.env.PUBLISH_BRANCH}/`;
          const ids = new Set();
          for (const plugin of plugins) {
            if (ids.has(plugin.id)) throw new Error(`Duplicate plugin: ${plugin.id}`);
            ids.add(plugin.id);
            for (const field of ['url', 'iconUrl', 'customJS', 'customCSS']) {
              const url = plugin[field];
              if (!url && (field === 'customJS' || field === 'customCSS')) continue;
              if (!url?.startsWith(prefix)) throw new Error(`Unexpected ${field} for ${plugin.id}: ${url}`);
              if (!fs.existsSync(url.slice(prefix.length))) throw new Error(`Missing file: ${url}`);
            }
          }
          console.log(`Validated ${plugins.length} plugins and their assets.`);
          NODE

      - name: Publish app repository
        shell: bash
        run: |
          git checkout --orphan "$PUBLISH_BRANCH"
          git reset
          git add -f public/static .dist .js/src/plugins total.svg
          git commit -m 'chore(plugins): publish fork plugins'
          # Only the generated branch is replaced; master retains its history.
          git push --force-with-lease="refs/heads/$PUBLISH_BRANCH:$PUBLISH_PREVIOUS_SHA" \
            origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          echo "App repository: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISH_BRANCH/.dist/plugins.min.json" >> "$GITHUB_STEP_SUMMARY"
